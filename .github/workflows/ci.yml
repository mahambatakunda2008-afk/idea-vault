name: Idea Vault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kaqqzslcnkhktlfiuwcu.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iv6NFejIdURpgldluhJxpw_7DZbEF09
          NEXT_PUBLIC_SITE_URL: https://idea-vault-mahambatakunda2008-1383s-projects.vercel.app
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kaqqzslcnkhktlfiuwcu.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iv6NFejIdURpgldluhJxpw_7DZbEF09
          NEXT_PUBLIC_SITE_URL: https://idea-vault-mahambatakunda2008-1383s-projects.vercel.app
